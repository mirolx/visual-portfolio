<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MY-DOYAK 2026 · 이승윤</title>
  <link rel="preload" href="assets/fonts/SejongGeulggot.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 첫 화면: 고양이. 스크롤하면 발이 이 화면을 아래로 끌어내린다 -->
  <section class="intro" id="intro" aria-label="인트로">
    <div class="intro__inner">
      <div class="intro__eyebrow">
        <p>MY-DOYAK 2026 · 소프트웨어학부 이승윤</p>
        <p class="intro__sub">생성형 AI로 실행한 나의 2026년</p>
      </div>
      <!-- 고양이 뒤로 지나가는 큰 글자. 두 단어 사이 간격을 고양이 몸통보다 조금 좁혀서 끝이 살짝 가려지게 한다 -->
      <p class="intro__display" aria-hidden="true"><span>VISUAL</span><span>PORTFOLIO</span></p>
      <div class="intro__cat" id="cat">
        <img class="cat__sit" id="cat-sit" src="assets/cat/cat-sitting.png" alt="앉아 있는 랙돌 고양이" />
        <img class="cat__up" id="cat-up" src="assets/cat/cat-paw-up.png" alt="" />
      </div>
      <div class="intro__hint" id="hint">
        <i class="intro__mouse" aria-hidden="true"></i>
        <span>Scroll</span>
      </div>
      <div class="intro__shade" id="shade"></div>
    </div>
  </section>

  <main class="work" id="work">
    <header class="work__head">
      <h2>Work <sup id="count"></sup></h2>
    </header>
    <div class="work__body">
      <ol class="work__list" id="list"></ol>
    </div>
    <footer class="work__foot">my-doyak.portfolio / 2026 / 이승윤 · Built with Claude Code · 글꼴: 세종글꽃체 © 세종특별자치시 (제작: 윤디자인그룹)</footer>
  </main>

  <!-- work__body는 전환 중 transform이 걸리므로 fixed 미리보기는 밖에 둔다 -->
  <div class="preview" id="preview" aria-hidden="true"></div>

  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="detail__backdrop" data-close></div>
    <article class="detail__panel">
      <button class="detail__close" type="button" data-close aria-label="닫기">✕</button>
      <div class="detail__media" id="detail-media"></div>
      <div class="detail__text">
        <p class="detail__cat" id="detail-cat"></p>
        <h3 class="detail__title" id="detail-title"></h3>
        <ul class="detail__tags" id="detail-tags"></ul>
        <p class="detail__summary" id="detail-summary"></p>
        <ul class="detail__points" id="detail-points"></ul>
        <p class="detail__learned" id="detail-learned"></p>
        <a class="detail__link" id="detail-link" target="_blank" rel="noopener"></a>
      </div>
    </article>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
